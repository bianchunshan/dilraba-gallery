        // 获取评分对应的样式类
        function getScoreClass(score) {
            if (score >= 90) return 'score-high';
            if (score >= 70) return 'score-medium';
            return 'score-low';
        }

        // 获取评分文字
        function getScoreText(score) {
            if (score >= 90) return '⭐⭐⭐⭐⭐ ' + score + '分';
            if (score >= 80) return '⭐⭐⭐⭐ ' + score + '分';
            if (score >= 70) return '⭐⭐⭐⭐ ' + score + '分';
            if (score >= 60) return '⭐⭐⭐ ' + score + '分';
            return '⭐⭐ ' + score + '分';
        }

        // 渲染画廊
        const gallery = document.getElementById('gallery');
        
        photoData.forEach((photo, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            const scoreClass = getScoreClass(photo.score);
            const scoreText = getScoreText(photo.score);
            
            card.innerHTML = `
                <div class="rank-number">${index + 1}</div>
                <div class="score-tag ${scoreClass}">${scoreText}</div>
                <img src="${photo.file}" alt="${photo.title}" loading="lazy" 
                     onerror="this.style.display='none'">
                <div class="photo-info">
                    <h3>${photo.title}</h3>
                    <p>${photo.desc}</p>
                </div>
            `;
            gallery.appendChild(card);
        });
    </script>
