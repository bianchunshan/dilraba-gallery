<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迪丽热巴高清写真 Gallery | Dilraba Dilmurat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #ff9ff3, #54a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            font-size: 1.3em;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .stats {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 50px;
            margin-top: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 40px auto;
            padding: 0 30px;
        }
        .photo-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .photo-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.3);
        }
        .photo-card img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }
        .photo-card:hover img {
            transform: scale(1.1);
        }
        .photo-info {
            padding: 20px;
            background: rgba(0,0,0,0.4);
        }
        .photo-info h3 {
            font-size: 1.3em;
            margin-bottom: 8px;
            color: #feca57;
        }
        .photo-info p {
            opacity: 0.7;
            font-size: 0.95em;
        }
        .footer {
            text-align: center;
            padding: 50px;
            opacity: 0.6;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 2.2em; }
            .gallery { grid-template-columns: 1fr; padding: 0 15px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💕 迪丽热巴写真 Gallery</h1>
        <p>Dilraba Dilmurat · 高清精选收藏</p>
        <div class="stats">
            📸 共 <span id="count">15</span> 张高清写真 | 原图无重复
        </div>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <div class="footer">
        <p>© 2026 迪丽热巴粉丝收藏站 | 仅供欣赏</p>
        <p>Made with 💕 for 春山</p>
    </div>
    
    <script>
        const photos = [
            { src: 'reba_hd_1.jpg', title: '蝴蝶仙子原图', desc: '梦幻翅膀 · 亮片礼服 · 1920x1080' },
            { src: 'reba_sexy_1.jpg', title: '深V吊带原图', desc: '优雅性感 · 红唇金饰 · 690x1227' },
            { src: 'reba_butterfly_avatar.jpg', title: '蝴蝶仙子头像', desc: '1080x1080 · 正方形裁剪' },
            { src: 'reba_sexy_avatar.jpg', title: '深V吊带头像', desc: '690x690 · 正方形' },
            { src: 'reba_avatar.jpg', title: '复古绿裙头像', desc: '240x240' },
            { src: 'reba_lemeitu_1.jpg', title: '黑金优雅', desc: '成熟大气 · 黑色礼服' },
            { src: 'reba_lemeitu_2.jpg', title: '甜美少女', desc: '粉色梦幻 · 托腮可爱' },
            { src: 'reba_lemeitu_3.jpg', title: '复古港风', desc: '绿裙红唇 · 性感妩媚' },
            { src: 'reba_lemeitu_4.jpg', title: '甜酷芭比', desc: '玫粉套装 · 冷艳甜美' },
            { src: 'reba_lemeitu_5.jpg', title: '明艳红裙', desc: '红色纱裙 · 慵懒性感' },
            { src: 'reba_flickr_3.jpg', title: 'InStyle牛仔', desc: '杂志街拍 · 街头蹲坐' },
            { src: 'reba_flickr_4.jpg', title: '白色蕾丝', desc: '街拍风 · 抬手遮阳' },
            { src: 'reba_instyle_avatar.jpg', title: 'InStyle头像', desc: '240x240 · 牛仔风' },
            { src: 'reba_instyle_original.jpg', title: 'InStyle原图', desc: '240x360' },
            { src: 'reba_butterfly_hd.jpg', title: '蝴蝶仙子备用', desc: '高清原图备份' }
        ];
        
        const gallery = document.getElementById('gallery');
        
        photos.forEach((photo, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${photo.src}" alt="${photo.title}" loading="lazy" 
                     onerror="this.parentElement.style.display='none'">
                <div class="photo-info">
                    <h3>${index + 1}. ${photo.title}</h3>
                    <p>${photo.desc}</p>
                </div>
            `;
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
