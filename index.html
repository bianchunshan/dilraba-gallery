<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迪丽热巴100张高清写真 | Dilraba Dilmurat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 3.5em;
            background: linear-gradient(45deg, #ff6b9d, #feca57, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        .header .count {
            font-size: 2em;
            color: #feca57;
            font-weight: bold;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px;
        }
        .photo-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .photo-card:hover {
            transform: translateY(-10px);
        }
        .photo-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }
        .photo-info {
            padding: 15px;
            text-align: center;
        }
        .photo-info h3 {
            color: #feca57;
            font-size: 1.1em;
        }
        .footer {
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💕 迪丽热巴写真 Gallery</h1>
        <p class="count">100张高清写真</p>
        <p>高清精选 · 原图无重复 · 持续更新</p>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <div class="footer">
        <p>© 2026 迪丽热巴粉丝收藏站 | Made with 💕 for 春山</p>
    </div>
    
    <script>
        // 自动生成100张图片列表
        const photos = [];
        
        // 原始11张
        const originalPhotos = [
            'reba_hd_1.jpg', 'reba_sexy_1.jpg', 'reba_lemeitu_1.jpg', 'reba_lemeitu_2.jpg',
            'reba_lemeitu_3.jpg', 'reba_lemeitu_4.jpg', 'reba_lemeitu_5.jpg',
            'reba_flickr_3.jpg', 'reba_flickr_4.jpg', 'reba_instyle_original.jpg'
        ];
        
        // 百度图片
        for (let i = 2; i <= 12; i++) {
            if (i !== 3 && i !== 5 && i !== 6 && i !== 7 && i !== 9) {
                originalPhotos.push('baidu_reba_0' + (i < 10 ? '0' + i : i) + '.jpg');
            }
        }
        
        // batch3
        originalPhotos.push('batch3_reba_004.jpg');
        
        // weibo
        originalPhotos.push('weibo_reba_012.jpg');
        
        // 自动生成 auto_reba_021 到 auto_reba_100
        for (let i = 21; i <= 100; i++) {
            originalPhotos.push('auto_reba_' + (i < 100 ? '0' + i : i) + '.jpg');
        }
        
        // 渲染
        const gallery = document.getElementById('gallery');
        originalPhotos.forEach((src, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${src}" alt="写真 ${index + 1}" loading="lazy" 
                     onerror="this.style.display='none'">
                <div class="photo-info">
                    <h3>${index + 1}. 迪丽热巴写真</h3>
                </div>
            `;
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
