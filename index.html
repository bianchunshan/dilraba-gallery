                <img src="${photo.file}" alt="${photo.title}" loading="lazy" 
                     onerror="this.style.display='none'">
                <div class="photo-info">
                    <h3>${index + 1}. ${photo.title}</h3>
                    <p>${photo.desc}</p>
                </div>
            `;
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
