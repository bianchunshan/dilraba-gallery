<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迪丽热巴写真 Gallery | Dilraba Dilmurat</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6b9d;
            --secondary: #c44569;
            --accent: #f8b500;
            --dark: #1a1a2e;
            --darker: #16213e;
        }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 107, 157, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
        }
        .header h1 {
            font-size: 4em;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b9d, #feca57, #ff9ff3, #54a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(255, 107, 157, 0.5);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }
        .header .subtitle {
            font-size: 1.4em;
            opacity: 0.9;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 3px;
        }
        .header .desc {
            font-size: 1em;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .stats {
            display: inline-flex;
            gap: 30px;
            background: rgba(255,255,255,0.08);
            padding: 20px 40px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .number {
            font-size: 2em;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.7;
            margin-top: 5px;
        }
        .filters {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .gallery {
            position: relative;
            z-index: 1;
            column-count: 4;
            column-gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px;
        }
        @media (max-width: 1400px) { .gallery { column-count: 3; } }
        @media (max-width: 1024px) { .gallery { column-count: 2; padding: 20px; } }
        @media (max-width: 600px) { .gallery { column-count: 1; } }
        .photo-card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.3);
        }
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s;
        }
        .photo-card:hover img {
            transform: scale(1.05);
        }
        .photo-info {
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 100%);
            margin-top: -80px;
            position: relative;
            z-index: 2;
        }
        .photo-info h3 {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 500;
        }
        .photo-info .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .photo-info .tag {
            font-size: 0.75em;
            padding: 4px 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            opacity: 0.9;
        }
        .photo-info .dims {
            font-size: 0.85em;
            opacity: 0.6;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox .close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 3em;
            color: #fff;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .lightbox .close:hover {
            opacity: 1;
        }
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 40px;
        }
        .footer p {
            margin: 10px 0;
        }
        .heart {
            color: var(--primary);
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="header">
        <h1>💕 迪丽热巴写真 Gallery</h1>
        <p class="subtitle">DILRABA DILMURAT</p>
        <p class="desc">高清精选收藏 · 原图无重复 · 持续更新</p>
        
        <div class="stats">
            <div class="stat-item">
                <div class="number" id="count">11</div>
                <div class="label">高清写真</div>
            </div>
            <div class="stat-item">
                <div class="number">8K</div>
                <div class="label">最大分辨率</div>
            </div>
            <div class="stat-item">
                <div class="number">💕</div>
                <div class="label">专属收藏</div>
            </div>
        </div>
    </div>
    
    <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="elegant">优雅</button>
        <button class="filter-btn" data-filter="sexy">性感</button>
        <button class="filter-btn" data-filter="sweet">甜美</button>
        <button class="filter-btn" data-filter="street">街拍</button>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <span class="close">&times;</span>
        <img src="" alt="" id="lightbox-img">
    </div>
    
    <div class="footer">
        <p>© 2026 迪丽热巴粉丝收藏站 | 仅供欣赏收藏</p>
        <p>Made with <span class="heart">💕</span> for 春山</p>
    </div>
    
    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }
        
        const photos = [
            { src: 'reba_hd_1.jpg', title: '蝴蝶仙子 · 高清版', tags: ['elegant', 'sweet'], dims: '1920×1080', desc: '梦幻翅膀 · 亮片礼服 · 1.4M超清' },
            { src: 'reba_butterfly_hd.jpg', title: '蝴蝶仙子 · 备用版', tags: ['elegant', 'sweet'], dims: '1920×1080', desc: '不同角度 · 330KB' },
            { src: 'reba_sexy_1.jpg', title: '深V吊带', tags: ['sexy', 'elegant'], dims: '690×1227', desc: '优雅性感 · 红唇金饰' },
            { src: 'reba_lemeitu_1.jpg', title: '黑金优雅', tags: ['elegant'], dims: '258×360', desc: '成熟大气 · 黑色礼服' },
            { src: 'reba_lemeitu_2.jpg', title: '甜美少女', tags: ['sweet'], dims: '263×360', desc: '粉色梦幻 · 托腮可爱' },
            { src: 'reba_lemeitu_3.jpg', title: '复古港风', tags: ['sexy', 'elegant'], dims: '240×360', desc: '绿裙红唇 · 性感妩媚' },
            { src: 'reba_lemeitu_4.jpg', title: '甜酷芭比', tags: ['sweet', 'sexy'], dims: '473×360', desc: '玫粉套装 · 冷艳甜美' },
            { src: 'reba_lemeitu_5.jpg', title: '明艳红裙', tags: ['sexy', 'elegant'], dims: '258×360', desc: '红色纱裙 · 慵懒性感' },
            { src: 'reba_flickr_3.jpg', title: 'InStyle牛仔', tags: ['street', 'sweet'], dims: '240×307', desc: '杂志街拍 · 街头蹲坐' },
            { src: 'reba_flickr_4.jpg', title: '白色蕾丝', tags: ['street', 'elegant'], dims: '640×427', desc: '街拍风 · 抬手遮阳' },
            { src: 'reba_instyle_original.jpg', title: 'InStyle原图', tags: ['sweet'], dims: '240×307', desc: '杂志风 · 牛仔外套' }
        ];
        
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        
        function renderGallery(filter = 'all') {
            gallery.innerHTML = '';
            let count = 0;
            
            photos.forEach((photo, index) => {
                if (filter !== 'all' && !photo.tags.includes(filter)) return;
                count++;
                
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="${photo.title}" loading="lazy" 
                         onerror="this.parentElement.style.display='none'">
                    <div class="photo-info">
                        <h3>${count}. ${photo.title}</h3>
                        <div class="tags">
                            ${photo.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <div class="dims">${photo.dims} · ${photo.desc}</div>
                    </div>
                `;
                
                card.onclick = () => {
                    lightboxImg.src = photo.src;
                    lightbox.classList.add('active');
                };
                
                gallery.appendChild(card);
            });
            
            document.getElementById('count').textContent = count;
        }
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGallery(btn.dataset.filter);
            };
        });
        
        renderGallery();
    </script>
</body>
</html>
