    <style>
        :root { --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #1a1a24; --accent: #ff6b9d; --accent-light: #ff9ff3; --text-primary: #f0f0f5; --text-secondary: #a0a0b0; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Noto Serif SC", -apple-system, BlinkMacSystemFont, serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .header { text-align: center; padding: 60px 20px 40px; background: linear-gradient(180deg, rgba(255,107,157,0.1) 0%, transparent 100%); position: relative; }
        .header h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; background: linear-gradient(135deg, #ff6b9d, #ff9ff3, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; letter-spacing: 2px; }
        .header .subtitle { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 8px; }
        .header .count { color: var(--accent); font-size: 1rem; font-weight: 600; }
        .gallery { max-width: 1400px; margin: 0 auto; padding: 30px 20px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
        @media (min-width: 1200px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); } }
        .photo-card { position: relative; border-radius: 16px; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .photo-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent); box-shadow: 0 20px 60px rgba(255,107,157,0.3), 0 0 100px rgba(255,107,157,0.1); }
        .img-wrap { position: relative; width: 100%; overflow: hidden; background: linear-gradient(135deg, #1a1a24, #2a2a3a); }
        .img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .photo-card:hover .img-wrap img { transform: scale(1.08); }
        .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .photo-card:hover .overlay { opacity: 1; }
        .view-icon { font-size: 2rem; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5)); }
        .lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox-img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; }
        .lightbox-prev { left: 20px; } .lightbox-next { right: 20px; }
        .footer { text-align: center; padding: 40px 20px; color: var(--text-secondary); border-top: 1px solid var(--border); font-size: 0.9rem; }
    </style>
</head>
