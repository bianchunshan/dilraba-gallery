<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迪丽热巴 · 影像画廊</title><meta name="description" content="迪丽热巴精选写真画廊，共 5306 张。"><style>:root{--bg:#0d0b10;--card:#1c1824;--text:#f2eee8;--muted:#9a93a5;--gold:#d8b16a;--gold-soft:rgba(216,177,106,.16)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -100px,rgba(216,177,106,.08),transparent 60%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}header{padding:54px 20px 24px;text-align:center}.kicker{display:inline-block;font-size:12px;letter-spacing:.38em;text-indent:.38em;color:var(--gold);margin-bottom:16px}h1{margin:0;font-size:clamp(30px,6vw,52px);font-weight:650;letter-spacing:.06em}.sub{margin:14px auto 0;max-width:620px;color:var(--muted);font-size:14px;line-height:1.8}.stats{display:flex;justify-content:center;gap:28px;margin-top:24px}.stat b{display:block;color:var(--gold);font-size:24px}.stat span{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:rgba(13,11,16,.84);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}.chip{border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer}.chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:22px clamp(14px,3vw,36px) 40px;max-width:1720px;margin:0 auto}@media(max-width:640px){.gallery{grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 12px 30px}}.card{position:relative;display:block;border-radius:14px;overflow:hidden;background:var(--card);min-height:260px;box-shadow:0 2px 10px rgba(0,0,0,.35)}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#17131d}.badge{position:absolute;left:10px;top:10px;z-index:2;background:rgba(10,8,14,.66);border:1px solid rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;font-size:11px}.badge .score{color:var(--gold)}.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(8,6,11,.94)}.lightbox.open{display:flex}.lightbox img{max-width:min(94vw,1000px);max-height:86vh;border-radius:10px}.lb-meta{position:fixed;left:0;right:0;bottom:20px;text-align:center;color:var(--muted)}.lb-btn{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(20,17,26,.7);color:var(--text);font-size:18px;cursor:pointer}.lb-prev{left:18px}.lb-next{right:18px}.lb-close{top:18px;right:18px;transform:none}footer{padding:34px 20px 46px;text-align:center;color:var(--muted);font-size:12px}.loading{padding:24px;text-align:center;color:var(--muted)}</style></head><body><header><span class="kicker">Dilraba Dilmurat</span><h1>迪丽热巴 · 影像画廊</h1><p class="sub">精选公开写真、红毯与时尚大片。点击任意照片进入全屏浏览。</p><div class="stats"><div class="stat"><b>5306</b><span>作品</span></div><div class="stat"><b>9.0</b><span>最高评分</span></div><div class="stat"><b>07.12</b><span>更新</span></div></div></header><nav class="toolbar"><button class="chip active" data-min="0">全部</button><button class="chip" data-min="9">9.0</button><button class="chip" data-min="8.5">8.5+</button><button class="chip" data-min="8">8.0+</button><button class="chip" data-min="7">7.0+</button></nav><div class="loading" id="loading">加载画廊数据...</div><main class="gallery" id="gallery"></main><div class="lightbox" id="lightbox"><img id="lb-img" alt=""><div class="lb-meta" id="lb-meta"></div><button class="lb-btn lb-prev" id="lb-prev">&#10094;</button><button class="lb-btn lb-next" id="lb-next">&#10095;</button><button class="lb-btn lb-close" id="lb-close">&#10005;</button></div><footer>共 5306 张 · 按评分排序 · chunked publish</footer><script>const gallery=document.getElementById('gallery'),loading=document.getElementById('loading');let items=[],visible=[],current=-1;const chunks=new Map();async function loadChunk(id){if(chunks.has(id))return chunks.get(id);const p=fetch(`data/chunk_${String(id).padStart(3,'0')}.json`).then(r=>r.json());chunks.set(id,p);return p}async function ensure(card){const img=card.querySelector('img');if(img.src)return img.src;const data=await loadChunk(card.dataset.chunk);const src=data[card.dataset.stem];img.src=src;card.href=src;return src}function render(list){gallery.innerHTML='';visible=list;for(const e of list){const a=document.createElement('a');a.className='card';a.href='#';a.dataset.rank=e.rank;a.dataset.score=e.score;a.dataset.stem=e.stem;a.dataset.chunk=e.chunk;a.innerHTML=`<span class="badge">#${e.rank} <span class="score">${e.score}</span></span><img loading="lazy" alt="迪丽热巴 #${e.rank}">`;a.onclick=async ev=>{ev.preventDefault();current=visible.indexOf(e);show(current)};gallery.appendChild(a)}observe()}function observe(){const io=new IntersectionObserver(es=>{for(const x of es){if(x.isIntersecting){ensure(x.target);io.unobserve(x.target)}}},{rootMargin:'900px'});document.querySelectorAll('.card').forEach(c=>io.observe(c))}async function show(i){if(!visible.length)return;current=(i+visible.length)%visible.length;const e=visible[current];const card=[...document.querySelectorAll('.card')].find(c=>+c.dataset.rank===e.rank);const src=card?await ensure(card):(await loadChunk(e.chunk))[e.stem];document.getElementById('lb-img').src=src;document.getElementById('lb-meta').textContent=`#${e.rank} / ${visible.length} · 评分 ${e.score}`;document.getElementById('lightbox').classList.add('open')}document.getElementById('lb-prev').onclick=()=>show(current-1);document.getElementById('lb-next').onclick=()=>show(current+1);document.getElementById('lb-close').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');const min=+b.dataset.min;render(items.filter(x=>x.score>=min))});fetch('data/manifest.json').then(r=>r.json()).then(m=>{items=m.sort((a,b)=>a.rank-b.rank);loading.remove();render(items)}).catch(e=>{loading.textContent='加载失败：'+e.message});</script></body></html>
