            card.innerHTML = `
                <img src="${photo.file}" alt="${photo.title}" loading="lazy">
                <div class="photo-info">
                    <h3>${photo.title}</h3>
                    <p>${photo.desc}</p>
                </div>
            `;
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
